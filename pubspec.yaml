name: match3
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.10+11

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  flutter_riverpod: ^3.4.3
  url_launcher: ^6.3.3
  flame: ^1.38.2
  flame_audio: ^2.12.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  assets:
    - assets/audio/

  uses-material-design: true

  fonts:
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
